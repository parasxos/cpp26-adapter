[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpp26-ref"
version = "0.0.1"
description = "MCP server providing canonical C++26 paper references and compiler-status lookup."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Paris Moschovakos", email = "parasxos@gmail.com" },
]
license = { text = "MIT" }
keywords = ["mcp", "cpp26", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
cpp26-ref = "cpp26_ref.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpp26_ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
