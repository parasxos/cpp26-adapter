# Compiler implementation status for deep-tier C++26 papers.
#
# Snapshot date: 2026-05-20 (see `last_refreshed`). This data goes stale
# fast — refresh via corpus/scripts/refresh_status.py (manual diff
# against upstream cxx-status pages + bloomberg/clang-p2996 README).
#
# Schema (per paper):
#   PXXXX:
#     <compiler-id>:
#       support: full | partial | none | unknown
#       version: "<earliest version with this support level, or 'fork'>"
#       note: "<free text, ≤120 chars>"
#
# Compiler ids tracked:
#   clang-22       — mainline LLVM clang 22 (released ~early 2026)
#   clang-p2996    — Bloomberg's reflection fork (tracks P2996 head)
#   gcc-16         — GCC 16 (released ~early 2026)
#   msvc-19.40     — MSVC compiler shipping with VS 2026
#
# Used INFORMATIONALLY by the cpp26-reviewer Pass-2 path to classify
# diagnostics as bug-vs-compiler-lag. NOT used by the suggestion path
# (the skill is compiler-agnostic per the Constitution).

