name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Only run the latest commit per branch — cancel older in-flight jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal lifecycle (install → pytest → package + size budget) lives
  # in the shared reusable workflow at parasxos/.github. Plugin-specific
  # steps (corpus validator, index ↔ refs consistency) follow below.
  shared:
    uses: parasxos/.github/.github/workflows/plugin-ci.yml@main
    with:
      python-version: '3.11'
      install-spec: 'mcp-server[dev]'
      test-paths: 'mcp-server/tests agents/tests'
      run-package: true
      package-script: 'tools/package.sh'
      tarball-glob: 'dist/cpp26-adapter-*.tgz'
      size-budget-kb: 5120

  corpus-consistency:
    name: corpus consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mcp-server (for pyyaml)
        run: |
          python -m pip install --upgrade pip
          pip install -e "mcp-server[dev]"

      - name: validate_corpus — schema + xref (skip syntax pass; no C++26-capable clang in CI)
        run: |
          python tools/validate_corpus.py --no-syntax-check

      - name: Sanity — every index row has a reference file
        run: |
          python - <<'PY'
          import yaml, sys
          from pathlib import Path

          rows = yaml.safe_load(Path("corpus/index.yaml").read_text())
          refs = {p.stem for p in Path("corpus/references").glob("*.md")}
          missing = sorted({r["id"] for r in rows if r.get("id")} - refs)
          if missing:
              print(f"missing references for: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"OK — {len(rows)} index rows, {len(refs)} reference files")
          PY
